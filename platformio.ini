; Bringup — PlatformIO project configuration.
;
; 🚀 COMMANDS
;   pio run -t flashall            firmware + web UI in one step (first flash)
;   pio run -t upload              firmware only
;   pio run -t uploadfs            web UI only (auto-gzips + re-stamps data/)
;   pio test -e native             host unit tests, no hardware needed
;   pio run -e <env> -t flashall   pick a board explicitly
;
; ⚠️ AFTER THE FIRST FIRMWARE FLASH, RUN uploadfs. Without it there is no web UI
;    in flash and the device serves a 503 telling you exactly that.
;
; 📌 PARTITIONS: every env pins an explicit table from partitions/. Read
;    docs/PARTITIONS.md before changing one — a partition change cannot be
;    delivered over OTA, only over USB.

[platformio]
default_envs = esp32-s3-devkitc-1

; ═══════════════════════════════════════════════════════════════════════════
; Shared settings. Envs inherit with `extends = common`.
; ═══════════════════════════════════════════════════════════════════════════
[common]
platform = espressif32@6.9.0
framework = arduino
board_build.filesystem = littlefs

extra_scripts =
    pre:scripts/version.py          ; FIRMWARE_VERSION / _BUILD_HASH / BRINGUP_BOARD_ID + data/fsver
    pre:scripts/gzip_web_files.py   ; re-stamp ?v= hashes + gzip data/ before (build|upload)fs
    scripts/flash_all.py            ; adds `pio run -t flashall`

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192   ; AsyncTCP needs the headroom for TLS work

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    ArduinoOTA

; ═══════════════════════════════════════════════════════════════════════════
; ESP32-S3 DevKitC-1 (8 MB flash) — DEFAULT
; ═══════════════════════════════════════════════════════════════════════════
[env:esp32-s3-devkitc-1]
extends = common
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = partitions/partitions_8mb.csv   ; 3 MB A/B slots, 1.875 MB fs

build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Serial goes over the native USB port
    -DARDUINO_USB_MODE=1

upload_speed = 921600

; ═══════════════════════════════════════════════════════════════════════════
; Seeed XIAO ESP32-S3 (8 MB flash, 8 MB OPI PSRAM)
; ═══════════════════════════════════════════════════════════════════════════
; The board definition ships 8 MB of flash but pins NO partition table, so the
; stock default.csv would give it 1.25 MB app slots and strand ~5 MB. Pinning
; the 8 MB table is the whole point.
;
; User LED is GPIO21 and ACTIVE LOW — the blink example still blinks, just with
; its phase inverted (checkbox off = LED on).
[env:seeed_xiao_esp32s3]
extends = common
board = seeed_xiao_esp32s3
board_build.partitions = partitions/partitions_8mb.csv   ; 3 MB A/B slots, 1.875 MB fs
board_build.f_cpu = 160000000L   ; 160 MHz — measured ~6 C cooler than 240 (docs/POWER.md)

build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Serial over the native USB port
    -DARDUINO_USB_MODE=1

; HEAT: this board idles warm — WiFi on an S3 in a tiny form factor. Measured on
; hardware to convergence (docs/POWER.md has the method and full numbers):
;   240 MHz -> ~62 C and still climbing at 6 min;  160 MHz -> flat 56 C.
; Hence the f_cpu line above. Other levers, honestly labelled:
;   • loop()'s delay(1) (src/main.cpp) made NO measurable thermal difference.
;     It is still correct — it stops starving the idle task — just not a fix.
;   • Disabling the unused 8 MB OPI PSRAM (build_unflags = -DBOARD_HAS_PSRAM)
;     also showed no measurable benefit, so PSRAM is left ON.
;   • WiFi modem sleep is off in setupWiFi() for SoftAP responsiveness; that is
;     the largest remaining lever and is untested here.

; 115200, not 921600. Like its C3 sibling, this board flashes over the chip's
; built-in USB-serial-JTAG, which drops the connection when esptool tries to
; raise the baud rate — the upload dies with "A fatal error occurred: No serial
; data received" AFTER successfully connecting and running the stub, which
; makes it look like a cable or board fault rather than a config one.
; Verified on hardware: 921600 fails at the baud change; 115200 gets further but
; the loaded stub then dies with "Unable to verify flash chip connection". Both
; are USB-serial-JTAG quirks, so --no-stub is needed too (same combination lume
; landed on for the XIAO C3).
upload_speed = 115200
upload_flags = --no-stub

; ═══════════════════════════════════════════════════════════════════════════
; ESP32-C3 DevKitM-1 (4 MB flash, RISC-V)
; ═══════════════════════════════════════════════════════════════════════════
[env:esp32-c3-devkitm-1]
extends = common
board = esp32-c3-devkitm-1
board_build.partitions = partitions/partitions_4mb.csv   ; 1.75 MB A/B slots, 384 KB fs

build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

upload_speed = 921600

; ═══════════════════════════════════════════════════════════════════════════
; Seeed XIAO ESP32-C3 (4 MB flash, RISC-V)
; ═══════════════════════════════════════════════════════════════════════════
[env:seeed_xiao_esp32c3]
extends = common
board = seeed_xiao_esp32c3
board_build.partitions = partitions/partitions_4mb.csv

build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; 115200, not 921600: the C3's built-in USB-serial-JTAG drops the connection on
; esptool's baud-rate bump and fails with "No serial data received".
upload_speed = 115200
upload_flags = --no-stub

; ═══════════════════════════════════════════════════════════════════════════
; Host unit tests — no hardware. `pio test -e native`
; ═══════════════════════════════════════════════════════════════════════════
; Only the pure, dependency-free logic is testable here — but that is exactly
; the logic where a bug is expensive: semver decides whether a device flashes
; itself, and BodyGuard decides whether two concurrent POSTs corrupt each other.
[env:native]
platform = native
test_framework = unity
test_build_src = no
test_filter =
    test_semver
    test_body_guard
build_flags =
    -std=c++17
    -I src
